# =============================================================================
# Configuration pour les tests E2E Lutece
# Ce fichier a la priorite sur les autres fichiers de configuration
# =============================================================================

# URL de base Lutece - IMPORTANT: doit correspondre a votre instance
lutece.base.url=http://localhost:9080/site-deontologie

# Configuration du navigateur Playwright
browser.headless=false
browser.slowmo=0
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080
browser.locale=fr-FR

# Repertoire des captures d'ecran
screenshots.path=target/screenshots

# Ordinal superieur a celui par defaut (100) pour surcharger core/agent,
# mais inferieur aux system properties (400) pour permettre -Dtest.headless=true etc.
config_ordinal=350

# === Proprietes bo3 ===

# Browser (bo3 pattern)
test.headless=false
test.timeout=30000
test.slowmo=0
test.viewport.width=1920
test.viewport.height=1080
test.locale=fr-FR
test.screenshots.path=target/screenshots

# Credentials
test.admin.username=admin
test.admin.password=adminadmin

# Workflow test data
test.workflow.name=Test integration wkf
test.workflow.description=Test d'integration workflow
test.workflow.state.initial=Etat initial
test.workflow.state.final=Etat final
test.workflow.action.name=Valider
test.workflow.action.description=Validation
test.workflow.task.type=modifyUpdateStatusTask

# Forms test data
test.forms.title=Forms Test integration
test.forms.question.text=Test question text
test.forms.question.number=Test nombre
test.forms.question.date=date
test.forms.question.comment.code=Test commentaire
test.forms.question.comment.text=Commentaire Test
test.forms.step.initial=Etape Initial
test.forms.step.final=Etape finale

# Submission test data
test.forms.submit.text=Text
test.forms.submit.number=22
test.forms.submit.date=2026-02-04

# Text long question test data
test.textlong.form.name=Forms Test integration 6379
test.textlong.step.name=Etape Initial
test.textlong.question.title=Text long
test.textlong.textarea.height=500
