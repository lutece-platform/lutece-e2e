# Configuration MicroProfile pour lutece-e2e-web
# Cette configuration a une priorite elevee (500) pour surcharger les valeurs par defaut

config_ordinal=500

# Configuration Azure OpenAI (valeurs injectees depuis les variables d'environnement)
azure.openai.api.key=${AZURE_OPENAI_API_KEY}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
azure.openai.deployment.name=${AZURE_OPENAI_DEPLOYMENT_NAME}

# Configuration Lutece cible
# lutece.base.url est intentionnellement vide pour etre demande a l'utilisateur
# Decommenter la ligne ci-dessous pour une configuration statique:
lutece.base.url=http://localhost:9080/site-deontologie
lutece.admin.username=admin
lutece.admin.password=adminadmin

# Configuration Playwright (noms utilises par BrowserManager)
browser.headless=true
browser.slowmo=0
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080
browser.locale=fr-FR
screenshots.path=target/screenshots

# Playwright driver path for OpenLiberty compatibility
# This bypasses the wsjar extraction issue by using pre-extracted driver
playwright.driver.path=/home/yahiaoui/lutece/workspace-site/playwright/lutece-e2e/playwright-driver/java/driver/linux/playwright.sh
