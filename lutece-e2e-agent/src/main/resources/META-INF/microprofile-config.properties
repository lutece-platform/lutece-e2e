# =============================================================================
# Configuration Lutece / Browser
# =============================================================================

# URL de base Lutece - sera demandee a l'utilisateur au debut du chat
# lutece.base.url=http://localhost:9080/site-deontologie

# Configuration du navigateur Playwright
browser.headless=false
browser.slowmo=0
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080
browser.locale=fr-FR

# Repertoire des captures d'ecran
screenshots.path=target/screenshots
