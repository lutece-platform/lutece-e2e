# Configuration MicroProfile pour plugin-e2e-agent
# Cette configuration a une priorite elevee (500) pour surcharger les valeurs par defaut

#config_ordinal=500

# Configuration Azure OpenAI (valeurs injectees depuis les variables d'environnement)
azure.openai.api.key=${AZURE_OPENAI_API_KEY}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
azure.openai.deployment.name=${AZURE_OPENAI_DEPLOYMENT_NAME}

# Configuration Lutece cible
# lutece.base.url est intentionnellement vide pour etre demande a l'utilisateur
# Decommenter la ligne ci-dessous pour une configuration statique:
lutece.base.url=http://localhost:9080/site-deontologie
lutece.admin.username=admin
lutece.admin.password=adminadmin

# Configuration Playwright (noms utilises par BrowserManager)
browser.headless=true
browser.slowmo=0
browser.timeout=30000
browser.viewport.width=1920
browser.viewport.height=1080
browser.locale=fr-FR
screenshots.path=target/screenshots


# =============================================================================
# Configuration LangChain4j CDI pour Lutece E2E Agent
# =============================================================================

# -----------------------------------------------------------------------------
# Chat Model Configuration (Azure OpenAI) - CONFIGURATION PAR DEFAUT
# Le nom "lutece-chat-model" correspond a chatModelName dans @RegisterAIService
# -----------------------------------------------------------------------------
dev.langchain4j.cdi.plugin.lutece-chat-model.class=dev.langchain4j.model.azure.AzureOpenAiChatModel
dev.langchain4j.cdi.plugin.lutece-chat-model.config.api-key=${azure.openai.api.key}
dev.langchain4j.cdi.plugin.lutece-chat-model.config.endpoint=${azure.openai.endpoint}
dev.langchain4j.cdi.plugin.lutece-chat-model.config.service-version=2024-02-15-preview
dev.langchain4j.cdi.plugin.lutece-chat-model.config.deployment-name=${azure.openai.deployment.name}
dev.langchain4j.cdi.plugin.lutece-chat-model.config.temperature=0.1
dev.langchain4j.cdi.plugin.lutece-chat-model.config.topP=0.1
dev.langchain4j.cdi.plugin.lutece-chat-model.config.timeout=120s
dev.langchain4j.cdi.plugin.lutece-chat-model.config.max-retries=2

# -----------------------------------------------------------------------------
# Chat Memory Configuration
# La memoire est geree par UserChatMemoryProvider (CDI bean @Named("per-user-memory"))
# Une ChatMemory isolee par X-Session-Id, nettoyee a l'expiration du HttpSession
# -----------------------------------------------------------------------------

